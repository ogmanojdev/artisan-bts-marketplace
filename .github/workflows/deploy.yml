name: Deploy to GCP

# Uses Workload Identity Federation (no JSON keys). Configure repo variables:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA, WEB_BUCKET, API_BASE_URL, RAZORPAY_KEY_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/artisan

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push images
        run: |
          docker build -f services/api/Dockerfile -t $REGISTRY/api:${GITHUB_SHA} .
          docker build -f services/transcoder/Dockerfile -t $REGISTRY/transcoder:${GITHUB_SHA} .
          docker push $REGISTRY/api:${GITHUB_SHA}
          docker push $REGISTRY/transcoder:${GITHUB_SHA}

      - name: Deploy transcoder job
        run: gcloud run jobs update artisan-transcoder --image $REGISTRY/transcoder:${GITHUB_SHA} --region $REGION

      - name: Deploy API
        run: gcloud run deploy artisan-api --image $REGISTRY/api:${GITHUB_SHA} --region $REGION --quiet

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm --workspace apps/mobile run build:web
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
          EXPO_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Upload static web build
        run: |
          gcloud storage rsync apps/mobile/dist gs://${{ vars.WEB_BUCKET }} --recursive --delete-unmatched-destination-objects
          gcloud storage objects update "gs://${{ vars.WEB_BUCKET }}/_expo/**" --cache-control="public, max-age=31536000, immutable"
          gcloud storage objects update "gs://${{ vars.WEB_BUCKET }}/**.html" --cache-control="public, max-age=60"
